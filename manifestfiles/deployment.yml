---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bankapp-deployment
spec:
  replicas: 3
  selector:
    matchLabels:
      app: bankapp
  template:
    metadata:
      labels:
        app: bankapp
    spec:
      containers:
      - name: bankapp-container
        image: poornapj/bloodbank:application
        ports:
        - containerPort: 80
        envFrom:
        - configMapRef:
            name: bankapp-config
        resources:
          requests:
            cpu: "100m"
            memory: "150Mi"
          limits:
            cpu: "500"
            memory: "500Mi"
        livenessProbe:
          httpGet: 
           path: /
           port: 80
          initialDelaySeconds: 15
          periodSeconds: 5
        readinessProbe:
          httpGet: 
           path: /
           port: 80
          initialDelaySeconds: 15
          periodSeconds: 5
